<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mi Vehículo - Ficha Completa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --primary: #6366f1;
    --primary-dark: #4f46e5;
    --primary-light: #eef2ff;
    --success: #10b981;
    --success-bg: #d1fae5;
    --warning: #f59e0b;
    --warning-bg: #fef3c7;
    --danger: #ef4444;
    --danger-bg: #fee2e2;
    --bg: #f8fafc;
    --card: #fff;
    --text: #0f172a;
    --text-muted: #64748b;
    --border: #e2e8f0;
    --shadow: 0 1px 3px rgba(0,0,0,.06), 0 1px 2px rgba(0,0,0,.04);
    --shadow-lg: 0 10px 25px -5px rgba(0,0,0,.1), 0 8px 10px -6px rgba(0,0,0,.05);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Inter', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
    padding-bottom: 60px;
  }

  /* HEADER */
  header {
    background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 50%, #a855f7 100%);
    color: #fff;
    padding: 28px 20px 90px;
    position: relative;
    overflow: hidden;
  }
  header::before {
    content: '';
    position: absolute;
    top: -40%; right: -5%;
    width: 450px; height: 450px;
    background: radial-gradient(circle, rgba(255,255,255,.15) 0%, transparent 70%);
    border-radius: 50%;
  }
  .header-content { max-width: 1200px; margin: 0 auto; position: relative; z-index: 1; }
  .logo-row { display: flex; align-items: center; gap: 12px; }
  .logo-icon {
    width: 46px; height: 46px;
    background: rgba(255,255,255,.2);
    backdrop-filter: blur(10px);
    border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    font-size: 22px;
  }
  header h1 { font-size: 22px; font-weight: 700; letter-spacing: -.02em; }
  header p { opacity: .85; font-size: 13px; margin-top: 2px; }

  /* SEARCH BAR PRINCIPAL */
  .search-main {
    max-width: 1200px;
    margin: -65px auto 0;
    padding: 0 20px;
    position: relative;
    z-index: 2;
  }
  .search-box {
    background: #fff;
    border-radius: 16px;
    padding: 20px;
    box-shadow: var(--shadow-lg);
    display: flex;
    gap: 12px;
    align-items: center;
  }
  .search-box .icon { font-size: 26px; flex-shrink: 0; }
  .search-box input {
    flex: 1;
    border: none;
    outline: none;
    font-size: 20px;
    font-weight: 600;
    font-family: inherit;
    padding: 10px;
    text-transform: uppercase;
    letter-spacing: .05em;
  }
  .search-box input::placeholder { color: #cbd5e1; text-transform: none; letter-spacing: 0; font-weight: 400; }

  /* CONTAINER */
  .container {
    max-width: 1200px;
    margin: 24px auto 0;
    padding: 0 20px;
  }

  /* FICHA */
  .ficha {
    background: #fff;
    border-radius: 16px;
    box-shadow: var(--shadow-lg);
    overflow: hidden;
    margin-bottom: 24px;
    animation: fadeIn .3s;
  }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  .ficha-header {
    background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
    color: #fff;
    padding: 24px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 16px;
  }
  .ficha-placa {
    font-size: 32px;
    font-weight: 800;
    letter-spacing: .08em;
  }
  .ficha-sub { opacity: .85; font-size: 14px; margin-top: 4px; }
  .ficha-actions { display: flex; gap: 8px; }

  .ficha-body { padding: 24px; }
  .ficha-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 20px;
    margin-bottom: 24px;
    padding-bottom: 24px;
    border-bottom: 1px solid var(--border);
  }
  .dato { display: flex; flex-direction: column; gap: 4px; }
  .dato-label {
    font-size: 11px;
    font-weight: 700;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: .06em;
  }
  .dato-value { font-size: 15px; font-weight: 600; color: var(--text); word-break: break-word; }
  .dato-value.vacio { color: #cbd5e1; font-weight: 400; font-style: italic; }

  .ficha-section-title {
    font-size: 14px;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 8px;
    text-transform: uppercase;
    letter-spacing: .05em;
  }

  /* TRAMITES */
  .tramite-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px 16px;
    background: #fafbfc;
    border-radius: 10px;
    margin-bottom: 8px;
    border-left: 4px solid var(--border);
    flex-wrap: wrap;
    gap: 12px;
  }
  .tramite-row.ok { border-left-color: var(--success); }
  .tramite-row.warn { border-left-color: var(--warning); }
  .tramite-row.danger { border-left-color: var(--danger); }
  .tramite-info { flex: 1; min-width: 200px; }
  .tramite-tipo { font-weight: 700; font-size: 14px; }
  .tramite-fecha { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
  .tramite-importe {
    font-weight: 700;
    font-size: 15px;
    color: var(--text);
    font-variant-numeric: tabular-nums;
    text-align: right;
  }
  .badge {
    padding: 4px 10px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .04em;
    display: inline-flex;
    align-items: center;
    gap: 5px;
  }
  .badge::before {
    content: '';
    width: 6px; height: 6px;
    border-radius: 50%;
    background: currentColor;
  }
  .badge.ok { background: var(--success-bg); color: #047857; }
  .badge.warn { background: var(--warning-bg); color: #b45309; }
  .badge.danger { background: var(--danger-bg); color: #b91c1c; }

  /* CARDS */
  .card {
    background: #fff;
    border-radius: 14px;
    box-shadow: var(--shadow);
    margin-bottom: 20px;
    overflow: hidden;
  }
  .card-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 16px 22px;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    user-select: none;
    transition: background .15s;
  }
  .card-header:hover { background: #f8fafc; }
  .card-title { display: flex; align-items: center; gap: 10px; font-size: 15px; font-weight: 600; }
  .chevron { transition: transform .25s; color: var(--text-muted); font-size: 12px; }
  .card.collapsed .chevron { transform: rotate(-90deg); }
  .card-body { padding: 22px; display: grid; gap: 14px; }
  .card.collapsed .card-body { display: none; }

  /* FORM */
  .form-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
    gap: 14px;
  }
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field label {
    font-size: 11px;
    font-weight: 700;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: .05em;
  }
  input, select, textarea {
    padding: 11px 14px;
    border: 1.5px solid var(--border);
    border-radius: 10px;
    font-size: 14px;
    font-family: inherit;
    color: var(--text);
    background: #fff;
    transition: border-color .15s, box-shadow .15s;
    width: 100%;
  }
  input:focus, select:focus, textarea:focus {
    outline: none;
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(99,102,241,.12);
  }

  /* BUTTONS */
  button {
    padding: 11px 18px;
    border: none;
    border-radius: 10px;
    font-size: 14px;
    font-family: inherit;
    font-weight: 600;
    cursor: pointer;
    transition: all .15s;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    white-space: nowrap;
  }
  .btn-primary { background: var(--primary); color: #fff; box-shadow: 0 1px 3px rgba(99,102,241,.3); }
  .btn-primary:hover { background: var(--primary-dark); transform: translateY(-1px); }
  .btn-outline { background: #fff; color: var(--text); border: 1.5px solid var(--border); }
  .btn-outline:hover { background: #f8fafc; }
  .btn-danger { background: var(--danger); color: #fff; }
  .btn-danger:hover { background: #dc2626; }
  .btn-white { background: rgba(255,255,255,.2); color: #fff; backdrop-filter: blur(10px); }
  .btn-white:hover { background: rgba(255,255,255,.3); }
  .btn-icon {
    padding: 5px 9px;
    font-size: 12px;
    background: transparent;
    color: var(--danger);
    border-radius: 6px;
  }
  .btn-icon:hover { background: var(--danger-bg); }

  /* EMPTY */
  .empty {
    text-align: center;
    padding: 50px 20px;
    color: var(--text-muted);
  }
  .empty-emoji { font-size: 54px; display: block; margin-bottom: 12px; opacity: .5; }
  .empty-title { font-weight: 700; color: var(--text); margin-bottom: 6px; font-size: 17px; }
  .empty-sub { font-size: 14px; }

  /* TOAST */
  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(100px);
    background: #0f172a;
    color: #fff;
    padding: 12px 20px;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 500;
    box-shadow: var(--shadow-lg);
    opacity: 0;
    transition: all .3s;
    z-index: 1000;
  }
  .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

  @media (max-width: 640px) {
    header { padding: 22px 16px 80px; }
    .search-box { padding: 14px; gap: 8px; }
    .search-box input { font-size: 17px; padding: 8px; }
    .ficha-placa { font-size: 26px; }
    .ficha-body { padding: 18px; }
    .container { padding: 0 14px; }
  }
</style>
</head>
<body>

<header>
  <div class="header-content">
    <div class="logo-row">
      <div class="logo-icon">🚗</div>
      <div>
        <h1>Mi Vehículo</h1>
        <p>Ficha completa y seguimiento de trámites</p>
      </div>
    </div>
  </div>
</header>

<!-- BUSCADOR PRINCIPAL -->
<div class="search-main">
  <div class="search-box">
    <span class="icon">🔍</span>
    <input id="buscarDominio" placeholder="Escribe tu dominio (ej: ABC123) para ver la ficha..." autocomplete="off">
  </div>
</div>

<div class="container">
  <div id="fichaContainer"></div>

  <!-- VEHÍCULO -->
  <div class="card collapsed" id="cardVehiculo">
    <div class="card-header" onclick="toggleCard('cardVehiculo')">
      <div class="card-title"><span>🚙</span> <span id="tituloVehiculo">Registrar mi Vehículo</span></div>
      <span class="chevron">▼</span>
    </div>
    <div class="card-body">
      <div class="form-grid">
        <div class="field"><label>Dominio / Placa *</label><input id="placa" placeholder="ABC123" maxlength="10"></div>
        <div class="field"><label>Marca *</label><input id="marca" placeholder="Toyota"></div>
        <div class="field"><label>Modelo</label><input id="modelo" placeholder="Corolla"></div>
        <div class="field"><label>Año</label><input id="anio" type="number" placeholder="2020" min="1950" max="2100"></div>
        <div class="field"><label>Color</label><input id="color" placeholder="Blanco"></div>
        <div class="field"><label>N° de Chasis</label><input id="chasis" placeholder="9BR..."></div>
        <div class="field"><label>N° de Motor</label><input id="motor" placeholder="1ZZ..."></div>
        <div class="field"><label>Radicación</label><input id="radicacion" placeholder="CABA / Córdoba"></div>
        <div class="field"><label>Propietario</label><input id="propietario" placeholder="Juan Pérez"></div>
        <div class="field"><label>DNI / CUIT</label><input id="dni" placeholder="20.123.456"></div>
        <div class="field"><label>Valuación fiscal</label><input id="valuacion" type="number" placeholder="5000000"></div>
        <div class="field"><label>Compañía de seguro</label><input id="seguro" placeholder="La Caja"></div>
        <div class="field" style="grid-column: 1/-1"><label>Notas del vehículo</label><input id="notasVeh" placeholder="Ej: nafta, 1.8, manual"></div>
      </div>
      <div style="display:flex;justify-content:flex-end;gap:8px">
        <button class="btn-outline" onclick="cancelarEdicion()" id="btnCancelar" style="display:none">Cancelar</button>
        <button class="btn-primary" onclick="guardarVehiculo()" id="btnGuardarVeh">💾 Guardar Vehículo</button>
      </div>
    </div>
  </div>

  <!-- TRÁMITE -->
  <div class="card collapsed" id="cardTramite">
    <div class="card-header" onclick="toggleCard('cardTramite')">
      <div class="card-title"><span>📄</span> Registrar Trámite / Documento</div>
      <span class="chevron">▼</span>
    </div>
    <div class="card-body">
      <div class="form-grid">
        <div class="field">
          <label>Vehículo</label>
          <select id="vehiculoSel"></select>
        </div>
        <div class="field">
          <label>Tipo de trámite</label>
          <select id="tipoDoc">
            <option>SOAT</option>
            <option>Tecnomecánica</option>
            <option>Impuesto Vehicular / Patente</option>
            <option>Licencia de Conducción</option>
            <option>Revisión de Gases</option>
            <option>Seguro</option>
            <option>Peaje / Telepeaje</option>
            <option>Multas</option>
            <option>Otro</option>
          </select>
        </div>
        <div class="field">
          <label>Fecha de vencimiento</label>
          <input id="fechaVenc" type="date">
        </div>
        <div class="field">
          <label>Importe (ARS)</label>
          <input id="importe" type="number" placeholder="0" step="0.01">
        </div>
        <div class="field" style="grid-column: 1/-1">
          <label>Notas (opcional)</label>
          <input id="notas" placeholder="Ej: pagado en Banco Nación, comprobante 1234">
        </div>
      </div>
      <div style="display:flex;justify-content:flex-end">
        <button class="btn-primary" onclick="agregarTramite()">➕ Guardar Trámite</button>
      </div>
    </div>
  </div>

  <!-- BACKUP -->
  <div class="card">
    <div class="card-header" style="cursor:default">
      <div class="card-title"><span>💾</span> Backup de datos</div>
    </div>
    <div class="card-body" style="display:flex;flex-direction:row;gap:10px;flex-wrap:wrap">
      <button class="btn-outline" onclick="exportar()">💾 Exportar datos</button>
      <button class="btn-outline" onclick="document.getElementById('importFile').click()">📂 Importar datos</button>
      <input type="file" id="importFile" accept=".json" style="display:none" onchange="importar(event)">
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ===== DATOS =====
let data = JSON.parse(localStorage.getItem('misVehiculos') || '{"vehiculos":[],"tramites":[]}');
let editandoId = null;

function guardar() { localStorage.setItem('misVehiculos', JSON.stringify(data)); }

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(window._tt);
  window._tt = setTimeout(() => t.classList.remove('show'), 2200);
}

function toggleCard(id) { document.getElementById(id).classList.toggle('collapsed'); }

// ===== VEHÍCULOS =====
function guardarVehiculo() {
  const placa = document.getElementById('placa').value.trim().toUpperCase();
  const marca = document.getElementById('marca').value.trim();

  if (!placa || !marca) return toast('⚠️ Dominio y marca son obligatorios');

  const vehiculo = {
    placa,
    marca,
    modelo: document.getElementById('modelo').value.trim(),
    anio: document.getElementById('anio').value.trim(),
    color: document.getElementById('color').value.trim(),
    chasis: document.getElementById('chasis').value.trim(),
    motor: document.getElementById('motor').value.trim(),
    radicacion: document.getElementById('radicacion').value.trim(),
    propietario: document.getElementById('propietario').value.trim(),
    dni: document.getElementById('dni').value.trim(),
    valuacion: document.getElementById('valuacion').value.trim(),
    seguro: document.getElementById('seguro').value.trim(),
    notasVeh: document.getElementById('notasVeh').value.trim()
  };

  if (editandoId) {
    const idx = data.vehiculos.findIndex(v => v.id === editandoId);
    data.vehiculos[idx] = { ...data.vehiculos[idx], ...vehiculo };
    toast('✅ Vehículo actualizado');
    cancelarEdicion();
  } else {
    if (data.vehiculos.find(v => v.placa === placa)) return toast('⚠️ Ya existe un vehículo con ese dominio');
    data.vehiculos.push({ id: Date.now(), ...vehiculo });
    toast('✅ Vehículo registrado');
  }

  guardar();
  limpiarFormVeh();
  refrescarSelect();
  render();
}

function limpiarFormVeh() {
  ['placa','marca','modelo','anio','color','chasis','motor','radicacion','propietario','dni','valuacion','seguro','notasVeh']
    .forEach(id => document.getElementById(id).value = '');
}

function editarVehiculo(id) {
  const v = data.vehiculos.find(x => x.id === id);
  if (!v) return;
  editandoId = id;
  document.getElementById('placa').value = v.placa || '';
  document.getElementById('marca').value = v.marca || '';
  document.getElementById('modelo').value = v.modelo || '';
  document.getElementById('anio').value = v.anio || '';
  document.getElementById('color').value = v.color || '';
  document.getElementById('chasis').value = v.chasis || '';
  document.getElementById('motor').value = v.motor || '';
  document.getElementById('radicacion').value = v.radicacion || '';
  document.getElementById('propietario').value = v.propietario || '';
  document.getElementById('dni').value = v.dni || '';
  document.getElementById('valuacion').value = v.valuacion || '';
  document.getElementById('seguro').value = v.seguro || '';
  document.getElementById('notasVeh').value = v.notasVeh || '';
  document.getElementById('tituloVehiculo').textContent = 'Editar Vehículo';
  document.getElementById('btnGuardarVeh').textContent = '💾 Actualizar Vehículo';
  document.getElementById('btnCancelar').style.display = 'inline-flex';
  document.getElementById('cardVehiculo').classList.remove('collapsed');
  document.getElementById('cardVehiculo').scrollIntoView({ behavior: 'smooth', block: 'center' });
}

function cancelarEdicion() {
  editandoId = null;
  limpiarFormVeh();
  document.getElementById('tituloVehiculo').textContent = 'Registrar mi Vehículo';
  document.getElementById('btnGuardarVeh').textContent = '💾 Guardar Vehículo';
  document.getElementById('btnCancelar').style.display = 'none';
}

function eliminarVehiculo(id) {
  if (!confirm('¿Eliminar este vehículo y TODOS sus trámites?')) return;
  data.vehiculos = data.vehiculos.filter(v => v.id !== id);
  data.tramites = data.tramites.filter(t => t.vehiculoId !== id);
  guardar();
  refrescarSelect();
  document.getElementById('buscarDominio').value = '';
  render();
  toast('🗑️ Vehículo eliminado');
}

// ===== TRÁMITES =====
function agregarTramite() {
  const vehiculoId = +document.getElementById('vehiculoSel').value;
  const tipo = document.getElementById('tipoDoc').value;
  const fecha = document.getElementById('fechaVenc').value;
  const importe = document.getElementById('importe').value;
  const notas = document.getElementById('notas').value.trim();

  if (!vehiculoId) return toast('⚠️ Selecciona un vehículo');
  if (!fecha) return toast('⚠️ Ingresa la fecha de vencimiento');

  data.tramites.push({ id: Date.now(), vehiculoId, tipo, fecha, importe, notas });
  guardar();
  document.getElementById('fechaVenc').value = '';
  document.getElementById('importe').value = '';
  document.getElementById('notas').value = '';
  render();
  toast('✅ Trámite registrado');
}

function eliminarTramite(id) {
  if (!confirm('¿Eliminar este trámite?')) return;
  data.tramites = data.tramites.filter(t => t.id !== id);
  guardar();
  render();
  toast('🗑️ Trámite eliminado');
}

// ===== SELECT =====
function refrescarSelect() {
  const sel = document.getElementById('vehiculoSel');
  if (!data.vehiculos.length) {
    sel.innerHTML = '<option value="">-- Primero registra un vehículo --</option>';
    return;
  }
  sel.innerHTML = '<option value="">-- Selecciona vehículo --</option>' +
    data.vehiculos.map(v => `<option value="${v.id}">${v.placa} · ${v.marca} ${v.modelo}</option>`).join('');
}

// ===== CÁLCULOS =====
function diasRestantes(fecha) {
  const hoy = new Date(); hoy.setHours(0,0,0,0);
  const venc = new Date(fecha + 'T00:00:00');
  return Math.ceil((venc - hoy) / 86400000);
}

function estado(d) {
  if (d < 0) return { clase: 'danger', texto: 'Vencido' };
  if (d <= 30) return { clase: 'warn', texto: 'Por vencer' };
  return { clase: 'ok', texto: 'Vigente' };
}

function formatoMoneda(n) {
  if (!n && n !== 0) return '—';
  return '$ ' + Number(n).toLocaleString('es-AR', { minimumFractionDigits: 0, maximumFractionDigits: 0 });
}

// ===== BUSCADOR / FICHA =====
function buscarVehiculo() {
  const q = document.getElementById('buscarDominio').value.trim().toUpperCase();
  const cont = document.getElementById('fichaContainer');

  if (!q) { cont.innerHTML = ''; return; }

  const v = data.vehiculos.find(x => x.placa.toUpperCase() === q)
          || data.vehiculos.find(x => x.placa.toUpperCase().includes(q));

  if (!v) {
    cont.innerHTML = `<div class="ficha"><div class="empty">
      <span class="empty-emoji">🔎</span>
      <div class="empty-title">No se encontró "${q}"</div>
      <div class="empty-sub">Verifica el dominio o regístralo abajo en "Registrar mi Vehículo"</div>
    </div></div>`;
    return;
  }

  const tramites = data.tramites
    .filter(t => t.vehiculoId === v.id)
    .map(t => ({ ...t, dias: diasRestantes(t.fecha), est: estado(diasRestantes(t.fecha)) }))
    .sort((a, b) => a.dias - b.dias);

  const totalImportes = tramites.reduce((s, t) => s + (Number(t.importe) || 0), 0);
  const proximoVenc = tramites.length ? tramites[0] : null;

  cont.innerHTML = `
    <div class="ficha">
      <div class="ficha-header">
        <div>
          <div class="ficha-placa">${v.placa}</div>
          <div class="ficha-sub">${v.marca} ${v.modelo} ${v.anio ? '· ' + v.anio : ''} ${v.color ? '· ' + v.color : ''}</div>
        </div>
        <div class="ficha-actions">
          <button class="btn-white" onclick="editarVehiculo(${v.id})">✏️ Editar</button>
          <button class="btn-white" onclick="eliminarVehiculo(${v.id})">🗑️</button>
        </div>
      </div>
      <div class="ficha-body">

        <div class="ficha-section-title">📋 Datos del vehículo</div>
        <div class="ficha-grid">
          ${dato('Marca', v.marca)}
          ${dato('Modelo', v.modelo)}
          ${dato('Año', v.anio)}
          ${dato('Color', v.color)}
          ${dato('N° Chasis', v.chasis)}
          ${dato('N° Motor', v.motor)}
          ${dato('Radicación', v.radicacion)}
          ${dato('Valuación fiscal', v.valuacion ? formatoMoneda(v.valuacion) : '')}
          ${dato('Compañía de seguro', v.seguro)}
        </div>

        <div class="ficha-section-title">👤 Propietario</div>
        <div class="ficha-grid">
          ${dato('Nombre', v.propietario)}
          ${dato('DNI / CUIT', v.dni)}
        </div>

        ${v.notasVeh ? `
        <div class="ficha-section-title">📝 Notas</div>
        <div style="background:#fafbfc;padding:14px;border-radius:10px;font-size:14px;margin-bottom:24px">${v.notasVeh}</div>` : ''}

        <div class="ficha-section-title" style="margin-top:24px">
          📅 Trámites y vencimientos (${tramites.length})
        </div>

        ${tramites.length ? tramites.map(t => `
          <div class="tramite-row ${t.est.clase}">
            <div class="tramite-info">
              <div class="tramite-tipo">${t.tipo}</div>
              <div class="tramite-fecha">Vence: ${t.fecha} ${t.notas ? '· ' + t.notas : ''}</div>
            </div>
            <div style="text-align:right">
              <div class="tramite-importe">${formatoMoneda(t.importe)}</div>
              <div style="font-size:11px;color:var(--text-muted);margin-top:2px">${t.dias} días</div>
            </div>
            <span class="badge ${t.est.clase}">${t.est.texto}</span>
            <button class="btn-icon" onclick="eliminarTramite(${t.id})" title="Eliminar">✕</button>
          </div>
        `).join('') : `
          <div style="text-align:center;padding:20px;color:var(--text-muted);font-size:14px">
            Sin trámites registrados. Agrégalos abajo 👇
          </div>
        `}

        ${tramites.length ? `
          <div style="margin-top:20px;padding:16px;background:var(--primary-light);border-radius:10px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px">
            <div>
              <div style="font-size:12px;color:var(--text-muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em">Total en trámites</div>
              <div style="font-size:22px;font-weight:800;color:var(--primary-dark)">${formatoMoneda(totalImportes)}</div>
            </div>
            ${proximoVenc ? `
            <div style="text-align:right">
              <div style="font-size:12px;color:var(--text-muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em">Próximo vencimiento</div>
              <div style="font-size:15px;font-weight:700;color:var(--text)">${proximoVenc.tipo} · ${proximoVenc.fecha}</div>
            </div>` : ''}
          </div>
        ` : ''}

      </div>
    </div>
  `;
}

function dato(label, valor) {
  const vacio = !valor;
  return `<div class="dato">
    <div class="dato-label">${label}</div>
    <div class="dato-value ${vacio ? 'vacio' : ''}">${vacio ? '—' : valor}</div>
  </div>`;
}

// ===== RENDER GENERAL =====
function render() {
  buscarVehiculo();
}

// ===== EXPORTAR / IMPORTAR =====
function exportar() {
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'backup-mi-vehiculo-' + new Date().toISOString().slice(0,10) + '.json';
  a.click();
  toast('💾 Backup descargado');
}

function importar(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    try {
      const nuevo = JSON.parse(ev.target.result);
      if (!nuevo.vehiculos || !nuevo.tramites) throw new Error('bad');
      data = nuevo;
      guardar();
      refrescarSelect();
      render();
      toast('✅ Datos importados');
    } catch {
      toast('⚠️ Archivo inválido');
    }
  };
  reader.readAsText(file);
  e.target.value = '';
}

// ===== BUSCADOR EN VIVO =====
document.getElementById('buscarDominio').addEventListener('input', buscarVehiculo);

// ===== INIT =====
refrescarSelect();
render();
</script>
</body>
</html>
