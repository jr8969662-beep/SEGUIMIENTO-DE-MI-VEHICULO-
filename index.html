<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seguimiento de mi Vehículo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --primary: #6366f1;
    --primary-dark: #4f46e5;
    --primary-light: #eef2ff;
    --success: #10b981;
    --success-bg: #d1fae5;
    --warning: #f59e0b;
    --warning-bg: #fef3c7;
    --danger: #ef4444;
    --danger-bg: #fee2e2;
    --bg: #f8fafc;
    --card: #ffffff;
    --text: #0f172a;
    --text-muted: #64748b;
    --border: #e2e8f0;
    --shadow: 0 1px 3px rgba(0,0,0,.06), 0 1px 2px rgba(0,0,0,.04);
    --shadow-lg: 0 10px 25px -5px rgba(0,0,0,.08), 0 8px 10px -6px rgba(0,0,0,.04);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    padding-bottom: 60px;
  }

  /* HEADER */
  header {
    background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 50%, #a855f7 100%);
    color: #fff;
    padding: 32px 20px 80px;
    position: relative;
    overflow: hidden;
  }
  header::before {
    content: '';
    position: absolute;
    top: -50%; right: -10%;
    width: 500px; height: 500px;
    background: radial-gradient(circle, rgba(255,255,255,.15) 0%, transparent 70%);
    border-radius: 50%;
  }
  header::after {
    content: '';
    position: absolute;
    bottom: -30%; left: -5%;
    width: 400px; height: 400px;
    background: radial-gradient(circle, rgba(255,255,255,.1) 0%, transparent 70%);
    border-radius: 50%;
  }
  .header-content {
    max-width: 1200px;
    margin: 0 auto;
    position: relative;
    z-index: 1;
  }
  .logo-row {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 8px;
  }
  .logo-icon {
    width: 44px; height: 44px;
    background: rgba(255,255,255,.2);
    backdrop-filter: blur(10px);
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
  }
  header h1 { font-size: 24px; font-weight: 700; letter-spacing: -.02em; }
  header p { opacity: .85; font-size: 14px; margin-top: 4px; }

  /* CONTAINER */
  .container {
    max-width: 1200px;
    margin: -60px auto 0;
    padding: 0 20px;
    position: relative;
    z-index: 2;
  }

  /* STATS */
  .stats {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 16px;
    margin-bottom: 24px;
  }
  .stat {
    background: var(--card);
    border-radius: 14px;
    padding: 18px;
    box-shadow: var(--shadow-lg);
    display: flex;
    align-items: center;
    gap: 14px;
    transition: transform .2s;
  }
  .stat:hover { transform: translateY(-2px); }
  .stat-icon {
    width: 46px; height: 46px;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    flex-shrink: 0;
  }
  .stat-icon.blue { background: var(--primary-light); }
  .stat-icon.green { background: var(--success-bg); }
  .stat-icon.yellow { background: var(--warning-bg); }
  .stat-icon.red { background: var(--danger-bg); }
  .stat-info { min-width: 0; }
  .stat-value { font-size: 24px; font-weight: 700; letter-spacing: -.02em; }
  .stat-label { font-size: 12px; color: var(--text-muted); font-weight: 500; text-transform: uppercase; letter-spacing: .04em; }

  /* CARDS */
  .card {
    background: var(--card);
    border-radius: 14px;
    box-shadow: var(--shadow);
    margin-bottom: 20px;
    overflow: hidden;
  }
  .card-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 18px 22px;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    user-select: none;
    transition: background .15s;
  }
  .card-header:hover { background: #f8fafc; }
  .card-title {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 16px;
    font-weight: 600;
    color: var(--text);
  }
  .card-title .emoji { font-size: 18px; }
  .chevron {
    transition: transform .25s;
    color: var(--text-muted);
    font-size: 12px;
  }
  .card.collapsed .chevron { transform: rotate(-90deg); }
  .card-body {
    padding: 22px;
    display: grid;
    gap: 14px;
  }
  .card.collapsed .card-body { display: none; }

  /* FORM */
  .form-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 14px;
  }
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field label {
    font-size: 12px;
    font-weight: 600;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: .04em;
  }
  input, select {
    padding: 11px 14px;
    border: 1.5px solid var(--border);
    border-radius: 10px;
    font-size: 14px;
    font-family: inherit;
    color: var(--text);
    background: #fff;
    transition: border-color .15s, box-shadow .15s;
    width: 100%;
  }
  input:focus, select:focus {
    outline: none;
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(99,102,241,.12);
  }

  /* BUTTONS */
  button {
    padding: 11px 18px;
    border: none;
    border-radius: 10px;
    font-size: 14px;
    font-family: inherit;
    font-weight: 600;
    cursor: pointer;
    transition: all .15s;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    white-space: nowrap;
  }
  .btn-primary {
    background: var(--primary);
    color: #fff;
    box-shadow: 0 1px 3px rgba(99,102,241,.3);
  }
  .btn-primary:hover { background: var(--primary-dark); transform: translateY(-1px); box-shadow: 0 4px 12px rgba(99,102,241,.3); }
  .btn-outline {
    background: #fff;
    color: var(--text);
    border: 1.5px solid var(--border);
  }
  .btn-outline:hover { background: #f8fafc; border-color: #cbd5e1; }
  .btn-danger {
    background: var(--danger);
    color: #fff;
  }
  .btn-danger:hover { background: #dc2626; }
  .btn-icon {
    padding: 6px 10px;
    font-size: 12px;
    background: transparent;
    color: var(--danger);
    border-radius: 8px;
  }
  .btn-icon:hover { background: var(--danger-bg); }

  /* TOOLBAR */
  .toolbar {
    display: grid;
    grid-template-columns: 1fr auto auto;
    gap: 10px;
    padding: 16px 22px;
    border-bottom: 1px solid var(--border);
    background: #fafbfc;
  }
  @media (max-width: 640px) {
    .toolbar { grid-template-columns: 1fr; }
  }
  .search-wrap { position: relative; }
  .search-wrap::before {
    content: '🔍';
    position: absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 14px;
    pointer-events: none;
  }
  .search-wrap input { padding-left: 40px; }
  .toolbar select { min-width: 180px; }
  .toolbar-actions { display: flex; gap: 8px; }

  /* TABLE */
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; }
  th, td { padding: 14px 22px; text-align: left; font-size: 14px; }
  th {
    background: #fafbfc;
    font-size: 11px;
    font-weight: 700;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: .06em;
    border-bottom: 1px solid var(--border);
  }
  td { border-bottom: 1px solid var(--border); }
  tbody tr { transition: background .12s; }
  tbody tr:hover { background: #fafbfc; }
  tbody tr:last-child td { border-bottom: none; }
  .placa {
    font-weight: 700;
    color: var(--primary-dark);
    background: var(--primary-light);
    padding: 4px 10px;
    border-radius: 6px;
    font-size: 12px;
    letter-spacing: .04em;
    display: inline-block;
  }
  .badge {
    padding: 4px 10px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .04em;
    display: inline-flex;
    align-items: center;
    gap: 5px;
  }
  .badge::before {
    content: '';
    width: 6px; height: 6px;
    border-radius: 50%;
    background: currentColor;
  }
  .badge.ok { background: var(--success-bg); color: #047857; }
  .badge.warn { background: var(--warning-bg); color: #b45309; }
  .badge.danger { background: var(--danger-bg); color: #b91c1c; }
  .dias { font-variant-numeric: tabular-nums; font-weight: 600; color: var(--text-muted); }

  .empty {
    text-align: center;
    padding: 60px 20px;
    color: var(--text-muted);
  }
  .empty-emoji { font-size: 48px; display: block; margin-bottom: 12px; opacity: .5; }
  .empty-title { font-weight: 600; color: var(--text); margin-bottom: 4px; }
  .empty-sub { font-size: 13px; }

  /* TOAST */
  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(100px);
    background: #0f172a;
    color: #fff;
    padding: 12px 20px;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 500;
    box-shadow: var(--shadow-lg);
    opacity: 0;
    transition: all .3s;
    z-index: 1000;
  }
  .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

  @media (max-width: 640px) {
    header { padding: 24px 16px 70px; }
    header h1 { font-size: 20px; }
    .container { padding: 0 14px; }
    .stats { gap: 10px; }
    .stat { padding: 14px; gap: 10px; }
    .stat-icon { width: 40px; height: 40px; font-size: 18px; }
    .stat-value { font-size: 20px; }
    th, td { padding: 12px 14px; font-size: 13px; }
    .card-header { padding: 16px; }
    .card-body { padding: 16px; }
    .toolbar { padding: 14px; }
  }
</style>
</head>
<body>

<header>
  <div class="header-content">
    <div class="logo-row">
      <div class="logo-icon">🚗</div>
      <div>
        <h1>Seguimiento de mi Vehículo</h1>
        <p>Control de documentos, trámites y vencimientos</p>
      </div>
    </div>
  </div>
</header>

<div class="container">

  <!-- STATS -->
  <div class="stats">
    <div class="stat">
      <div class="stat-icon blue">🚙</div>
      <div class="stat-info">
        <div class="stat-value" id="statVehiculos">0</div>
        <div class="stat-label">Vehículos</div>
      </div>
    </div>
    <div class="stat">
      <div class="stat-icon green">✅</div>
      <div class="stat-info">
        <div class="stat-value" id="statVigentes">0</div>
        <div class="stat-label">Vigentes</div>
      </div>
    </div>
    <div class="stat">
      <div class="stat-icon yellow">⏰</div>
      <div class="stat-info">
        <div class="stat-value" id="statPorVencer">0</div>
        <div class="stat-label">Por vencer</div>
      </div>
    </div>
    <div class="stat">
      <div class="stat-icon red">⚠️</div>
      <div class="stat-info">
        <div class="stat-value" id="statVencidos">0</div>
        <div class="stat-label">Vencidos</div>
      </div>
    </div>
  </div>

  <!-- VEHÍCULO -->
  <div class="card collapsed" id="cardVehiculo">
    <div class="card-header" onclick="toggleCard('cardVehiculo')">
      <div class="card-title"><span class="emoji">🚙</span> Registrar Vehículo</div>
      <span class="chevron">▼</span>
    </div>
    <div class="card-body">
      <div class="form-grid">
        <div class="field">
          <label>Placa</label>
          <input id="placa" placeholder="ABC123" maxlength="10">
        </div>
        <div class="field">
          <label>Marca</label>
          <input id="marca" placeholder="Toyota">
        </div>
        <div class="field">
          <label>Modelo</label>
          <input id="modelo" placeholder="Corolla">
        </div>
        <div class="field">
          <label>Año</label>
          <input id="anio" type="number" placeholder="2020" min="1950" max="2100">
        </div>
      </div>
      <div style="display:flex;justify-content:flex-end">
        <button class="btn-primary" onclick="agregarVehiculo()">➕ Guardar Vehículo</button>
      </div>
    </div>
  </div>

  <!-- TRÁMITE -->
  <div class="card collapsed" id="cardTramite">
    <div class="card-header" onclick="toggleCard('cardTramite')">
      <div class="card-title"><span class="emoji">📄</span> Registrar Trámite / Documento</div>
      <span class="chevron">▼</span>
    </div>
    <div class="card-body">
      <div class="form-grid">
        <div class="field">
          <label>Vehículo</label>
          <select id="vehiculoSel"></select>
        </div>
        <div class="field">
          <label>Tipo de trámite</label>
          <select id="tipoDoc">
            <option>SOAT</option>
            <option>Tecnomecánica</option>
            <option>Impuesto Vehicular</option>
            <option>Licencia de Conducción</option>
            <option>Revisión de Gases</option>
            <option>Seguro</option>
            <option>Otro</option>
          </select>
        </div>
        <div class="field">
          <label>Fecha de vencimiento</label>
          <input id="fechaVenc" type="date">
        </div>
        <div class="field">
          <label>Notas (opcional)</label>
          <input id="notas" placeholder="Ej: pagado en Banco X">
        </div>
      </div>
      <div style="display:flex;justify-content:flex-end">
        <button class="btn-primary" onclick="agregarTramite()">➕ Guardar Trámite</button>
      </div>
    </div>
  </div>

  <!-- LISTADO -->
  <div class="card">
    <div class="card-header" style="cursor:default">
      <div class="card-title"><span class="emoji">📋</span> Vencimientos</div>
    </div>
    <div class="toolbar">
      <div class="search-wrap">
        <input id="buscar" placeholder="Buscar por placa o tipo..." oninput="render()">
      </div>
      <select id="filtro" onchange="render()">
        <option value="todos">Todos</option>
        <option value="vencido">Vencidos</option>
        <option value="porVencer">Por vencer (30 días)</option>
        <option value="vigente">Vigentes</option>
      </select>
      <div class="toolbar-actions">
        <button class="btn-outline" onclick="exportar()" title="Descargar backup">💾 Exportar</button>
        <button class="btn-outline" onclick="document.getElementById('importFile').click()" title="Cargar backup">📂 Importar</button>
        <input type="file" id="importFile" accept=".json" style="display:none" onchange="importar(event)">
      </div>
    </div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Placa</th>
            <th>Vehículo</th>
            <th>Trámite</th>
            <th>Vence</th>
            <th>Días</th>
            <th>Estado</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="tabla"></tbody>
      </table>
    </div>
  </div>

</div>

<div class="toast" id="toast"></div>

<script>
let data = JSON.parse(localStorage.getItem('vehiculosData') || '{"vehiculos":[],"tramites":[]}');

function guardar() { localStorage.setItem('vehiculosData', JSON.stringify(data)); }

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}

function toggleCard(id) { document.getElementById(id).classList.toggle('collapsed'); }

function agregarVehiculo() {
  const placa = document.getElementById('placa').value.trim().toUpperCase();
  const marca = document.getElementById('marca').value.trim();
  const modelo = document.getElementById('modelo').value.trim();
  const anio = document.getElementById('anio').value.trim();

  if (!placa || !marca) return toast('⚠️ Placa y marca son obligatorios');
  if (data.vehiculos.find(v => v.placa === placa)) return toast('⚠️ Ya existe esa placa');

  data.vehiculos.push({ id: Date.now(), placa, marca, modelo, anio });
  guardar();
  ['placa','marca','modelo','anio'].forEach(id => document.getElementById(id).value = '');
  refrescarSelect();
  render();
  toast('✅ Vehículo registrado');
}

function agregarTramite() {
  const vehiculoId = +document.getElementById('vehiculoSel').value;
  const tipo = document.getElementById('tipoDoc').value;
  const fecha = document.getElementById('fechaVenc').value;
  const notas = document.getElementById('notas').value.trim();

  if (!vehiculoId) return toast('⚠️ Selecciona un vehículo');
  if (!fecha) return toast('⚠️ Ingresa la fecha de vencimiento');

  data.tramites.push({ id: Date.now(), vehiculoId, tipo, fecha, notas });
  guardar();
  document.getElementById('fechaVenc').value = '';
  document.getElementById('notas').value = '';
  render();
  toast('✅ Trámite registrado');
}

function refrescarSelect() {
  const sel = document.getElementById('vehiculoSel');
  if (!data.vehiculos.length) {
    sel.innerHTML = '<option value="">-- Primero registra un vehículo --</option>';
    return;
  }
  sel.innerHTML = '<option value="">-- Selecciona vehículo --</option>' +
    data.vehiculos.map(v => `<option value="${v.id}">${v.placa} · ${v.marca} ${v.modelo}</option>`).join('');
}

function diasRestantes(fecha) {
  const hoy = new Date(); hoy.setHours(0,0,0,0);
  const venc = new Date(fecha + 'T00:00:00');
  return Math.ceil((venc - hoy) / 86400000);
}

function estado(d) {
  if (d < 0) return { clase: 'danger', texto: 'Vencido' };
  if (d <= 30) return { clase: 'warn', texto: 'Por vencer' };
  return { clase: 'ok', texto: 'Vigente' };
}

function render() {
  // Stats
  const todos = data.tramites.map(t => diasRestantes(t.fecha));
  document.getElementById('statVehiculos').textContent = data.vehiculos.length;
  document.getElementById('statVigentes').textContent = todos.filter(d => d > 30).length;
  document.getElementById('statPorVencer').textContent = todos.filter(d => d >= 0 && d <= 30).length;
  document.getElementById('statVencidos').textContent = todos.filter(d => d < 0).length;

  const buscar = document.getElementById('buscar').value.toLowerCase();
  const filtro = document.getElementById('filtro').value;
  const tbody = document.getElementById('tabla');
  tbody.innerHTML = '';

  const lista = data.tramites.map(t => {
    const v = data.vehiculos.find(x => x.id === t.vehiculoId) || {};
    const dias = diasRestantes(t.fecha);
    return {
      ...t,
      placa: v.placa || '?',
      vehiculo: `${v.marca || ''} ${v.modelo || ''}`.trim() || '—',
      dias,
      est: estado(dias)
    };
  }).filter(t => {
    const ok = !buscar || t.placa.toLowerCase().includes(buscar) || t.tipo.toLowerCase().includes(buscar);
    if (!ok) return false;
    if (filtro === 'vencido') return t.dias < 0;
    if (filtro === 'porVencer') return t.dias >= 0 && t.dias <= 30;
    if (filtro === 'vigente') return t.dias > 30;
    return true;
  }).sort((a, b) => a.dias - b.dias);

  if (!lista.length) {
    const hayDatos = data.tramites.length > 0;
    tbody.innerHTML = `<tr><td colspan="7">
      <div class="empty">
        <span class="empty-emoji">${hayDatos ? '🔍' : '📭'}</span>
        <div class="empty-title">${hayDatos ? 'Sin resultados' : 'Aún no hay trámites registrados'}</div>
        <div class="empty-sub">${hayDatos ? 'Prueba con otros filtros de búsqueda' : 'Registra un vehículo y luego sus documentos'}</div>
      </div>
    </td></tr>`;
    return;
  }

  lista.forEach(t => {
    tbody.innerHTML += `
      <tr>
        <td><span class="placa">${t.placa}</span></td>
        <td>${t.vehiculo}</td>
        <td><strong>${t.tipo}</strong>${t.notas ? `<div style="font-size:12px;color:var(--text-muted)">${t.notas}</div>` : ''}</td>
        <td>${t.fecha}</td>
        <td class="dias">${t.dias}</td>
        <td><span class="badge ${t.est.clase}">${t.est.texto}</span></td>
        <td><button class="btn-icon" onclick="eliminar(${t.id})" title="Eliminar">✕</button></td>
      </tr>`;
  });
}

function eliminar(id) {
  if (!confirm('¿Eliminar este trámite?')) return;
  data.tramites = data.tramites.filter(t => t.id !== id);
  guardar();
  render();
  toast('🗑️ Trámite eliminado');
}

function exportar() {
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'backup-vehiculos-' + new Date().toISOString().slice(0,10) + '.json';
  a.click();
  toast('💾 Backup descargado');
}

function importar(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    try {
      const nuevo = JSON.parse(ev.target.result);
      if (!nuevo.vehiculos || !nuevo.tramites) throw new Error('bad');
      data = nuevo;
      guardar();
      refrescarSelect();
      render();
      toast('✅ Datos importados');
    } catch {
      toast('⚠️ Archivo inválido');
    }
  };
  reader.readAsText(file);
  e.target.value = '';
}

refrescarSelect();
render();
</script>
