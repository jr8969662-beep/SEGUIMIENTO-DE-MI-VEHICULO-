<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seguimiento de mi Vehículo</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, -apple-system, sans-serif; background: #f0f2f5; color: #1a1a1a; padding: 20px; }
  .container { max-width: 1100px; margin: auto; }
  h1 { margin-bottom: 20px; color: #1e3a8a; }
  .card { background: #fff; border-radius: 10px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,.08); margin-bottom: 20px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }
  input, select, button { padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 14px; width: 100%; }
  button { background: #1e3a8a; color: #fff; border: none; cursor: pointer; font-weight: 600; }
  button:hover { background: #172554; }
  button.danger { background: #dc2626; }
  button.danger:hover { background: #991b1b; }
  table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 14px; }
  th, td { padding: 10px; text-align: left; border-bottom: 1px solid #e5e7eb; }
  th { background: #f8fafc; }
  .badge { padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: 600; }
  .ok { background: #dcfce7; color: #166534; }
  .warn { background: #fef3c7; color: #92400e; }
  .danger-badge { background: #fee2e2; color: #991b1b; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .row > * { flex: 1; min-width: 140px; }
  h2 { margin-bottom: 12px; color: #334155; font-size: 18px; }
  .sin-registros { text-align: center; color: #94a3b8; padding: 20px; }
</style>
</head>
<body>
<div class="container">
  <h1>🚗 Seguimiento de mi Vehículo</h1>

  <!-- Registro de vehículo -->
  <div class="card">
    <h2>➕ Registrar Vehículo</h2>
    <div class="grid">
      <input id="placa" placeholder="Placa (ej: ABC123)">
      <input id="marca" placeholder="Marca">
      <input id="modelo" placeholder="Modelo">
      <input id="anio" type="number" placeholder="Año">
      <button onclick="agregarVehiculo()">Guardar Vehículo</button>
    </div>
  </div>

  <!-- Registro de trámite -->
  <div class="card">
    <h2>📄 Registrar Trámite / Documento</h2>
    <div class="grid">
      <select id="vehiculoSel"></select>
      <select id="tipoDoc">
        <option>SOAT</option>
        <option>Tecnomecánica</option>
        <option>Impuesto Vehicular</option>
        <option>Licencia de Conducción</option>
        <option>Revisión de Gases</option>
        <option>Otro</option>
      </select>
      <input id="fechaVenc" type="date" title="Fecha de vencimiento">
      <input id="notas" placeholder="Notas (opcional)">
      <button onclick="agregarTramite()">Guardar Trámite</button>
    </div>
  </div>

  <!-- Listado -->
  <div class="card">
    <h2>📋 Vencimientos</h2>
    <div class="row" style="margin-bottom:10px">
      <input id="buscar" placeholder="🔍 Buscar por placa o tipo..." oninput="render()">
      <select id="filtro" onchange="render()">
        <option value="todos">Todos</option>
        <option value="vencido">Vencidos</option>
        <option value="porVencer">Por vencer (30 días)</option>
        <option value="vigente">Vigentes</option>
      </select>
      <button onclick="exportar()">💾 Exportar</button>
      <button onclick="document.getElementById('importFile').click()">📂 Importar</button>
      <input type="file" id="importFile" accept=".json" style="display:none" onchange="importar(event)">
    </div>
    <table>
      <thead>
        <tr>
          <th>Placa</th><th>Vehículo</th><th>Trámite</th>
          <th>Vence</th><th>Días</th><th>Estado</th><th></th>
        </tr>
      </thead>
      <tbody id="tabla"></tbody>
    </table>
  </div>
</div>

<script>
// ===== DATOS =====
let data = JSON.parse(localStorage.getItem('vehiculosData') || '{"vehiculos":[],"tramites":[]}');

function guardar() {
  localStorage.setItem('vehiculosData', JSON.stringify(data));
}

// ===== VEHÍCULOS =====
function agregarVehiculo() {
  const placa = document.getElementById('placa').value.trim().toUpperCase();
  const marca = document.getElementById('marca').value.trim();
  const modelo = document.getElementById('modelo').value.trim();
  const anio = document.getElementById('anio').value.trim();

  if (!placa || !marca) return alert('Placa y marca son obligatorios');

  if (data.vehiculos.find(v => v.placa === placa)) {
    return alert('Ya existe un vehículo con esa placa');
  }

  data.vehiculos.push({ id: Date.now(), placa, marca, modelo, anio });
  guardar();

  ['placa','marca','modelo','anio'].forEach(id => document.getElementById(id).value = '');
  refrescarSelect();
  render();
}

// ===== TRÁMITES =====
function agregarTramite() {
  const vehiculoId = +document.getElementById('vehiculoSel').value;
  const tipo = document.getElementById('tipoDoc').value;
  const fecha = document.getElementById('fechaVenc').value;
  const notas = document.getElementById('notas').value.trim();

  if (!vehiculoId) return alert('Selecciona un vehículo');
  if (!fecha) return alert('Ingresa la fecha de vencimiento');

  data.tramites.push({ id: Date.now(), vehiculoId, tipo, fecha, notas });
  guardar();

  document.getElementById('fechaVenc').value = '';
  document.getElementById('notas').value = '';
  render();
}

// ===== SELECT DE VEHÍCULOS =====
function refrescarSelect() {
  const sel = document.getElementById('vehiculoSel');
  sel.innerHTML = '<option value="">-- Selecciona vehículo --</option>' +
    data.vehiculos.map(v => `<option value="${v.id}">${v.placa} - ${v.marca} ${v.modelo}</option>`).join('');
}

// ===== CÁLCULO DE DÍAS Y ESTADO =====
function diasRestantes(fecha) {
  const hoy = new Date(); hoy.setHours(0,0,0,0);
  const venc = new Date(fecha + 'T00:00:00');
  return Math.ceil((venc - hoy) / (1000*60*60*24));
}

function estado(dias) {
  if (dias < 0) return { clase: 'danger-badge', texto: 'Vencido' };
  if (dias <= 30) return { clase: 'warn', texto: 'Por vencer' };
  return { clase: 'ok', texto: 'Vigente' };
}

// ===== RENDER TABLA =====
function render() {
  const buscar = document.getElementById('buscar').value.toLowerCase();
  const filtro = document.getElementById('filtro').value;
  const tbody = document.getElementById('tabla');
  tbody.innerHTML = '';

  const lista = data.tramites.map(t => {
    const v = data.vehiculos.find(x => x.id === t.vehiculoId) || {};
    const dias = diasRestantes(t.fecha);
    return {
      ...t,
      placa: v.placa || '?',
      vehiculo: `${v.marca || ''} ${v.modelo || ''}`.trim(),
      dias,
      est: estado(dias)
    };
  }).filter(t => {
    const coincideBusqueda = !buscar ||
      t.placa.toLowerCase().includes(buscar) ||
      t.tipo.toLowerCase().includes(buscar);

    if (!coincideBusqueda) return false;

    if (filtro === 'vencido') return t.dias < 0;
    if (filtro === 'porVencer') return t.dias >= 0 && t.dias <= 30;
    if (filtro === 'vigente') return t.dias > 30;
    return true;
  }).sort((a, b) => a.dias - b.dias);

  if (!lista.length) {
    tbody.innerHTML = '<tr><td colspan="7" class="sin-registros">Sin registros para mostrar</td></tr>';
    return;
  }

  lista.forEach(t => {
    tbody.innerHTML += `
      <tr>
        <td><strong>${t.placa}</strong></td>
        <td>${t.vehiculo}</td>
        <td>${t.tipo}</td>
        <td>${t.fecha}</td>
        <td>${t.dias}</td>
        <td><span class="badge ${t.est.clase}">${t.est.texto}</span></td>
        <td>
          <button class="danger" style="padding:4px 8px;font-size:12px"
            onclick="eliminar(${t.id})">X</button>
        </td>
      </tr>`;
  });
}

// ===== ELIMINAR TRÁMITE =====
function eliminar(id) {
  if (!confirm('¿Eliminar este trámite?')) return;
  data.tramites = data.tramites.filter(t => t.id !== id);
  guardar();
  render();
}

// ===== EXPORTAR / IMPORTAR =====
function exportar() {
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'vehiculos_backup.json';
  a.click();
}

function importar(e) {
  const file = e.target.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = ev => {
    try {
      const nuevo = JSON.parse(ev.target.result);
      if (!nuevo.vehiculos || !nuevo.tramites) throw new Error('Formato inválido');
      data = nuevo;
      guardar();
      refrescarSelect();
      render();
      alert('Datos importados correctamente');
    } catch {
      alert('Archivo inválido. Debe ser un backup generado por esta aplicación.');
    }
  };
  reader.readAsText(file);
}

// ===== INICIALIZACIÓN =====
refrescarSelect();
render();
</script>
</body>
</html>
