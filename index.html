<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mi Vehículo - Ficha Completa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --primary: #ef4444;
    --primary-dark: #dc2626;
    --primary-light: #2a1215;
    --success: #22c55e;
    --success-bg: rgba(34,197,94,.15);
    --warning: #f59e0b;
    --warning-bg: rgba(245,158,11,.15);
    --danger: #ef4444;
    --danger-bg: rgba(239,68,68,.15);
    --bg: #0a0a0a;
    --card: #161616;
    --card-2: #1c1c1c;
    --text: #f5f5f5;
    --text-muted: #8a8a8a;
    --border: #2a2a2a;
    --border-strong: #ef4444;
    --shadow: 0 1px 3px rgba(0,0,0,.5);
    --shadow-lg: 0 10px 30px -5px rgba(0,0,0,.7), 0 0 40px -10px rgba(239,68,68,.25);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Inter', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
    padding-bottom: 60px;
    min-height: 100vh;
  }

  header {
    background: linear-gradient(135deg, #0a0a0a 0%, #1a0808 50%, #0a0a0a 100%);
    border-bottom: 1px solid var(--border);
    padding: 28px 20px 90px;
    position: relative;
    overflow: hidden;
  }
  header::before {
    content: '';
    position: absolute;
    top: -50%; right: -5%;
    width: 500px; height: 500px;
    background: radial-gradient(circle, rgba(239,68,68,.25) 0%, transparent 65%);
    border-radius: 50%;
    pointer-events: none;
  }
  header::after {
    content: '';
    position: absolute;
    bottom: -30%; left: -10%;
    width: 450px; height: 450px;
    background: radial-gradient(circle, rgba(239,68,68,.12) 0%, transparent 70%);
    border-radius: 50%;
    pointer-events: none;
  }
  .header-content { max-width: 1200px; margin: 0 auto; position: relative; z-index: 1; }
  .logo-row { display: flex; align-items: center; gap: 12px; }
  .logo-icon {
    width: 46px; height: 46px;
    background: rgba(239,68,68,.15);
    border: 1.5px solid var(--primary);
    border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    font-size: 22px;
    box-shadow: 0 0 20px rgba(239,68,68,.4), inset 0 0 10px rgba(239,68,68,.1);
  }
  header h1 {
    font-size: 22px; font-weight: 700; letter-spacing: -.02em;
    color: #fff;
    text-shadow: 0 0 20px rgba(239,68,68,.3);
  }
  header p { color: var(--text-muted); font-size: 13px; margin-top: 2px; }

  .search-main {
    max-width: 1200px;
    margin: -65px auto 0;
    padding: 0 20px;
    position: relative;
    z-index: 2;
  }
  .search-box {
    background: var(--card);
    border: 2px solid var(--border-strong);
    border-radius: 16px;
    padding: 18px 20px;
    box-shadow: var(--shadow-lg);
    display: flex;
    gap: 12px;
    align-items: center;
    transition: box-shadow .2s;
  }
  .search-box:focus-within {
    box-shadow: 0 10px 30px -5px rgba(0,0,0,.7), 0 0 0 3px rgba(239,68,68,.25), 0 0 40px -5px rgba(239,68,68,.5);
  }
  .search-box .icon { font-size: 24px; filter: drop-shadow(0 0 8px rgba(239,68,68,.7)); }
  .search-box input {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    font-size: 20px;
    font-weight: 700;
    font-family: inherit;
    padding: 8px;
    color: #fff;
    text-transform: uppercase;
    letter-spacing: .08em;
  }
  .search-box input::placeholder {
    color: #4a4a4a;
    text-transform: none;
    letter-spacing: 0;
    font-weight: 400;
  }

  .container {
    max-width: 1200px;
    margin: 24px auto 0;
    padding: 0 20px;
  }

  .ficha {
    background: var(--card);
    border: 1.5px solid var(--border);
    border-radius: 16px;
    box-shadow: var(--shadow-lg);
    overflow: hidden;
    margin-bottom: 24px;
    animation: fadeIn .3s;
  }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  .ficha-header {
    background: linear-gradient(135deg, #1a0808 0%, #2a0a0a 100%);
    border-bottom: 2px solid var(--primary);
    padding: 24px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 16px;
    position: relative;
  }
  .ficha-header::after {
    content: '';
    position: absolute;
    bottom: -2px; left: 0;
    width: 100%; height: 2px;
    background: linear-gradient(90deg, transparent, var(--primary), transparent);
    filter: blur(1px);
  }
  .ficha-header-content { display: flex; align-items: center; gap: 20px; flex-wrap: wrap; }
  .ficha-foto {
    width: 130px; height: 90px;
    object-fit: cover;
    border-radius: 10px;
    border: 2px solid var(--primary);
    box-shadow: 0 0 25px rgba(239,68,68,.6);
  }

  /* LOGO DE MARCA */
  .marca-logo-grande {
    width: 80px;
    height: 80px;
    object-fit: contain;
    filter: drop-shadow(0 0 20px rgba(239,68,68,.8));
    flex-shrink: 0;
    padding: 8px;
    background: rgba(239,68,68,.08);
    border-radius: 14px;
    border: 1.5px solid rgba(239,68,68,.4);
  }
  .marca-logo {
    width: 40px;
    height: 40px;
    object-fit: contain;
    filter: drop-shadow(0 0 10px rgba(239,68,68,.6));
    flex-shrink: 0;
  }

  .ficha-placa {
    font-size: 32px;
    font-weight: 800;
    letter-spacing: .12em;
    color: #fff;
    text-shadow: 0 0 20px rgba(239,68,68,.7), 0 0 40px rgba(239,68,68,.4);
  }
  .ficha-sub { color: var(--text-muted); font-size: 14px; margin-top: 4px; }
  .ficha-actions { display: flex; gap: 8px; flex-wrap: wrap; }

  /* COUNTDOWN BANNER */
  .countdown {
    padding: 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 24px;
    flex-wrap: wrap;
    border-bottom: 2px solid var(--border);
    background: linear-gradient(135deg, #0a0a0a, #1a1a1a);
  }
  .countdown.ok { border-bottom-color: var(--success); background: linear-gradient(135deg, #081a0e, #0a2a12); }
  .countdown.warn { border-bottom-color: var(--warning); background: linear-gradient(135deg, #1a1008, #2a1a08); }
  .countdown.danger { border-bottom-color: var(--danger); background: linear-gradient(135deg, #1a0808, #2a0a0a); }
  .countdown-left { display: flex; align-items: center; gap: 20px; flex-wrap: wrap; }
  .countdown-num {
    font-size: 68px;
    font-weight: 800;
    line-height: 1;
    color: #fff;
    letter-spacing: -.04em;
    text-shadow: 0 0 30px currentColor;
  }
  .countdown.ok .countdown-num { color: #4ade80; }
  .countdown.warn .countdown-num { color: #fbbf24; }
  .countdown.danger .countdown-num { color: #f87171; }
  .countdown-label { font-size: 11px; text-transform: uppercase; letter-spacing: .1em; color: var(--text-muted); font-weight: 700; }
  .countdown-tipo { font-size: 22px; font-weight: 700; color: #fff; margin-top: 4px; }
  .countdown-fecha { font-size: 13px; color: var(--text-muted); margin-top: 2px; }
  .countdown-right { text-align: right; }
  .countdown-total-label { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--text-muted); font-weight: 700; }
  .countdown-total { font-size: 24px; font-weight: 800; color: #fff; text-shadow: 0 0 20px rgba(239,68,68,.5); }

  .ficha-body { padding: 24px; }
  .ficha-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 16px;
    margin-bottom: 24px;
    padding-bottom: 24px;
    border-bottom: 1px solid var(--border);
  }
  .dato {
    display: flex; flex-direction: column; gap: 6px;
    padding: 12px 14px;
    background: var(--card-2);
    border: 1px solid var(--border);
    border-left: 3px solid var(--primary);
    border-radius: 8px;
  }
  .dato.alert-warn { border-left-color: var(--warning); background: rgba(245,158,11,.05); }
  .dato.alert-danger { border-left-color: var(--danger); background: rgba(239,68,68,.08); }
  .dato.alert-ok { border-left-color: var(--success); background: rgba(34,197,94,.05); }
  .dato-label {
    font-size: 10px;
    font-weight: 700;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: .08em;
  }
  .dato-value { font-size: 15px; font-weight: 600; color: #fff; word-break: break-word; }
  .dato-value.vacio { color: #3a3a3a; font-weight: 400; font-style: italic; }

  .ficha-section-title {
    font-size: 13px;
    font-weight: 700;
    color: #fff;
    margin-bottom: 14px;
    display: flex;
    align-items: center;
    gap: 8px;
    text-transform: uppercase;
    letter-spacing: .08em;
  }
  .ficha-section-title::after {
    content: '';
    flex: 1;
    height: 1px;
    background: linear-gradient(90deg, var(--primary), transparent);
    margin-left: 8px;
  }

  /* FILTROS */
  .filtros {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 16px;
  }
  .chip {
    padding: 8px 16px;
    border-radius: 999px;
    background: transparent;
    border: 1.5px solid var(--border);
    color: var(--text-muted);
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .05em;
    cursor: pointer;
    transition: all .15s;
    font-family: inherit;
  }
  .chip:hover { border-color: var(--primary); color: #fff; }
  .chip.active {
    background: var(--primary);
    border-color: var(--primary);
    color: #fff;
    box-shadow: 0 0 15px rgba(239,68,68,.5);
  }

  .tramite-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px 16px;
    background: var(--card-2);
    border-radius: 10px;
    margin-bottom: 8px;
    border: 1px solid var(--border);
    border-left: 4px solid var(--border);
    flex-wrap: wrap;
    gap: 12px;
    transition: all .2s;
  }
  .tramite-row:hover { background: #202020; transform: translateX(2px); }
  .tramite-row.ok { border-left-color: var(--success); box-shadow: inset 4px 0 12px -8px var(--success); }
  .tramite-row.warn { border-left-color: var(--warning); box-shadow: inset 4px 0 12px -8px var(--warning); }
  .tramite-row.danger { border-left-color: var(--danger); box-shadow: inset 4px 0 12px -8px var(--danger); }
  .tramite-info { flex: 1; min-width: 200px; }
  .tramite-tipo { font-weight: 700; font-size: 14px; color: #fff; }
  .tramite-fecha { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
  .tramite-importe {
    font-weight: 700;
    font-size: 15px;
    color: #fff;
    font-variant-numeric: tabular-nums;
    text-align: right;
    text-shadow: 0 0 12px rgba(239,68,68,.3);
  }
  .badge {
    padding: 4px 10px;
    border-radius: 999px;
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .06em;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    border: 1px solid currentColor;
  }
  .badge::before {
    content: '';
    width: 6px; height: 6px;
    border-radius: 50%;
    background: currentColor;
    box-shadow: 0 0 8px currentColor;
  }
  .badge.ok { background: var(--success-bg); color: #4ade80; }
  .badge.warn { background: var(--warning-bg); color: #fbbf24; }
  .badge.danger { background: var(--danger-bg); color: #f87171; }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    box-shadow: var(--shadow);
    margin-bottom: 20px;
    overflow: hidden;
    transition: border-color .2s;
  }
  .card:hover { border-color: #3a3a3a; }
  .card-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 16px 22px;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    user-select: none;
    transition: background .15s;
  }
  .card-header:hover { background: var(--card-2); }
  .card-title {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 15px;
    font-weight: 600;
    color: #fff;
  }
  .chevron {
    transition: transform .25s;
    color: var(--primary);
    font-size: 12px;
    filter: drop-shadow(0 0 6px rgba(239,68,68,.6));
  }
  .card.collapsed .chevron { transform: rotate(-90deg); }
  .card-body { padding: 22px; display: grid; gap: 14px; }
  .card.collapsed .card-body { display: none; }

  .form-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
    gap: 14px;
  }
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field label {
    font-size: 10px;
    font-weight: 700;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: .08em;
  }
  input, select, textarea {
    padding: 11px 14px;
    background: #0f0f0f;
    border: 2px solid var(--primary);
    border-radius: 10px;
    font-size: 14px;
    font-family: inherit;
    color: #fff;
    transition: all .2s;
    width: 100%;
    box-shadow: 0 0 0 rgba(239,68,68,0), inset 0 0 12px rgba(239,68,68,.05);
  }
  input::placeholder { color: #4a4a4a; }
  input:hover, select:hover {
    box-shadow: 0 0 12px rgba(239,68,68,.3), inset 0 0 12px rgba(239,68,68,.08);
  }
  input:focus, select:focus, textarea:focus {
    outline: none;
    border-color: #ff5555;
    background: #150808;
    box-shadow: 0 0 0 3px rgba(239,68,68,.2), 0 0 25px rgba(239,68,68,.5), inset 0 0 15px rgba(239,68,68,.1);
  }
  select {
    appearance: none;
    background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23ef4444' stroke-width='2'%3e%3cpolyline points='6 9 12 15 18 9'/%3e%3c/svg%3e");
    background-repeat: no-repeat;
    background-position: right 12px center;
    background-size: 16px;
    padding-right: 38px;
  }
  select option { background: #0f0f0f; color: #fff; }

  input[type="date"]::-webkit-calendar-picker-indicator {
    filter: invert(1) sepia(1) saturate(5) hue-rotate(330deg);
    cursor: pointer;
  }

  .field.has-list { position: relative; }
  .field.has-list::after {
    content: '▾';
    position: absolute;
    right: 14px;
    bottom: 12px;
    color: var(--primary);
    font-size: 12px;
    pointer-events: none;
    filter: drop-shadow(0 0 4px rgba(239,68,68,.6));
  }
  .field.has-list input { padding-right: 34px; }

  button {
    padding: 11px 18px;
    border: none;
    border-radius: 10px;
    font-size: 12px;
    font-family: inherit;
    font-weight: 700;
    cursor: pointer;
    transition: all .15s;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    white-space: nowrap;
    text-transform: uppercase;
    letter-spacing: .04em;
  }
  .btn-primary {
    background: linear-gradient(135deg, var(--primary), var(--primary-dark));
    color: #fff;
    box-shadow: 0 0 20px rgba(239,68,68,.4), 0 4px 12px rgba(0,0,0,.4);
    border: 1px solid #ff5555;
  }
  .btn-primary:hover {
    background: linear-gradient(135deg, #ff5555, var(--primary));
    transform: translateY(-1px);
    box-shadow: 0 0 30px rgba(239,68,68,.7), 0 6px 16px rgba(0,0,0,.5);
  }
  .btn-outline {
    background: transparent;
    color: #fff;
    border: 1.5px solid var(--primary);
    box-shadow: inset 0 0 15px rgba(239,68,68,.1);
  }
  .btn-outline:hover {
    background: rgba(239,68,68,.15);
    box-shadow: inset 0 0 20px rgba(239,68,68,.2), 0 0 20px rgba(239,68,68,.3);
  }
  .btn-white {
    background: rgba(239,68,68,.15);
    color: #fff;
    border: 1.5px solid var(--primary);
    backdrop-filter: blur(10px);
  }
  .btn-white:hover { background: rgba(239,68,68,.3); box-shadow: 0 0 20px rgba(239,68,68,.5); }
  .btn-icon {
    padding: 5px 9px;
    font-size: 12px;
    background: transparent;
    color: var(--primary);
    border-radius: 6px;
    border: 1px solid transparent;
  }
  .btn-icon:hover {
    background: var(--danger-bg);
    border-color: var(--primary);
    box-shadow: 0 0 12px rgba(239,68,68,.4);
  }

  .empty { text-align: center; padding: 50px 20px; color: var(--text-muted); }
  .empty-emoji {
    font-size: 54px; display: block; margin-bottom: 12px;
    opacity: .7;
    filter: drop-shadow(0 0 15px rgba(239,68,68,.5));
  }
  .empty-title { font-weight: 700; color: #fff; margin-bottom: 6px; font-size: 17px; }
  .empty-sub { font-size: 14px; }

  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(100px);
    background: #1a0808;
    color: #fff;
    padding: 12px 22px;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 600;
    border: 1.5px solid var(--primary);
    box-shadow: 0 0 30px rgba(239,68,68,.6), 0 10px 25px rgba(0,0,0,.6);
    opacity: 0;
    transition: all .3s;
    z-index: 1000;
  }
  .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--primary-dark); border-radius: 5px; border: 2px solid var(--bg); }
  ::-webkit-scrollbar-thumb:hover { background: var(--primary); }

  .total-box {
    margin-top: 20px;
    padding: 18px;
    background: linear-gradient(135deg, rgba(239,68,68,.08), rgba(239,68,68,.02));
    border: 1.5px solid var(--primary);
    border-radius: 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px;
    box-shadow: inset 0 0 30px rgba(239,68,68,.08);
  }
  .total-label {
    font-size: 11px; color: var(--text-muted); font-weight: 700;
    text-transform: uppercase; letter-spacing: .08em;
  }
  .total-value {
    font-size: 24px; font-weight: 800; color: #fff;
    text-shadow: 0 0 20px rgba(239,68,68,.6);
  }

  .notas-box {
    background: var(--card-2);
    border-left: 3px solid var(--primary);
    padding: 14px 16px;
    border-radius: 8px;
    font-size: 14px;
    margin-bottom: 24px;
    color: #e5e5e5;
  }

  @media (max-width: 640px) {
    header { padding: 22px 16px 80px; }
    .search-box { padding: 14px; gap: 8px; }
    .search-box input { font-size: 17px; padding: 8px; }
    .ficha-placa { font-size: 26px; }
    .ficha-body { padding: 18px; }
    .ficha-foto { width: 90px; height: 65px; }
    .marca-logo-grande { width: 60px; height: 60px; padding: 6px; }
    .container { padding: 0 14px; }
    .countdown-num { font-size: 48px; }
    .countdown-tipo { font-size: 18px; }
    .countdown { padding: 18px; gap: 14px; }
  }

  /* ========== PRINT ========== */
  @media print {
    @page { margin: 1cm; size: A4; }
    body {
      background: #fff !important;
      color: #000 !important;
      padding: 0 !important;
    }
    header, .search-main, .card, .toast, .ficha-actions, .btn-print, .filtros, .btn-icon { display: none !important; }
    .container { padding: 0 !important; max-width: 100% !important; margin: 0 !important; }
    .ficha { box-shadow: none !important; border: 1px solid #999 !important; border-radius: 6px !important; }
    .ficha-header {
      background: #f0f0f0 !important;
      border-bottom: 2px solid #333 !important;
      color: #000 !important;
    }
    .ficha-header::after { display: none; }
    .ficha-placa, .ficha-sub { color: #000 !important; text-shadow: none !important; }
    .countdown { background: #f8f8f8 !important; border-bottom: 2px solid #333 !important; color: #000 !important; }
    .countdown-num, .countdown-tipo, .countdown-total { color: #000 !important; text-shadow: none !important; }
    .countdown-label, .countdown-fecha, .countdown-total-label { color: #555 !important; }
    .ficha-body, .dato, .tramite-row, .total-box, .notas-box {
      background: #fff !important;
      color: #000 !important;
      border-color: #ccc !important;
      box-shadow: none !important;
    }
    .dato { border-left: 3px solid #666 !important; }
    .dato-value, .tramite-tipo, .tramite-importe, .total-value { color: #000 !important; text-shadow: none !important; }
    .dato-label, .tramite-fecha, .total-label { color: #666 !important; }
    .ficha-section-title { color: #000 !important; }
    .ficha-section-title::after { background: #999 !important; }

<div class="search-main">

function guardarVehiculo() {
  const placa = document.getElementById('placa').value.trim().toUpperCase();
  const marca = document.getElementById('marca').value.trim();
  if (!placa || !marca) return toast('⚠️ Dominio y marca son obligatorios');

  const vehiculo = {
    placa, marca,
    modelo: document.getElementById('modelo').value.trim(),
    anio: document.getElementById('anio').value,
    color: document.getElementById('color').value.trim(),
    radicacion: document.getElementById('radicacion').value.trim(),
    combustible: document.getElementById('combustible').value.trim(),
    caja: document.getElementById('caja').value.trim(),
    chasis: document.getElementById('chasis').value.trim(),
    motor: document.getElementById('motor').value.trim(),
    propietario: document.getElementById('propietario').value.trim(),
    dni: document.getElementById('dni').value.trim(),
    valuacion: document.getElementById('valuacion').value.trim(),
    seguro: document.getElementById('seguro').value.trim(),
    foto: document.getElementById('foto').value.trim(),
    notasVeh: document.getElementById('notasVeh').value.trim(),
    kmActual: document.getElementById('kmActual').value.trim(),
    kmProximoService: document.getElementById('kmProximoService').value.trim(),
    fechaProximoService: document.getElementById('fechaProximoService').value,
    seguroMensual: document.getElementById('seguroMensual').value.trim(),
    fechaVencimientoCuota: document.getElementById('fechaVencimientoCuota').value
  };

  if (editandoId) {
    const idx = data.vehiculos.findIndex(v => v.id === editandoId);
    data.vehiculos[idx] = { ...data.vehiculos[idx], ...vehiculo };
    toast('✅ Vehículo actualizado');
    cancelarEdicion();
  } else {
    if (data.vehiculos.find(v => v.placa === placa)) return toast('⚠️ Ya existe un vehículo con ese dominio');
    data.vehiculos.push({ id: Date.now(), ...vehiculo });
    toast('✅ Vehículo registrado');
  }

  guardar();
  limpiarFormVeh();
  refrescarSelect();
  render();
}

function limpiarFormVeh() {

    .forEach(id => document.getElementById(id).value = '');
  document.getElementById('anio').value = '';
  actualizarModelos();
}

function editarVehiculo(id) {
  const v = data.vehiculos.find(x => x.id === id);
  if (!v) return;
  editandoId = id;
  const campos = ['placa','marca','modelo','color','radicacion','combustible','caja','chasis','motor','propietario','dni','valuacion','seguro','foto','notasVeh','kmActual','kmProximoService','fechaProximoService','seguroMensual','fechaVencimientoCuota'];
  document.getElementById('marca').value = v.marca || '';
  actualizarModelos();
  campos.forEach(c => document.getElementById(c).value = v[c] || '');
  document.getElementById('anio').value = v.anio || '';
  document.getElementById('tituloVehiculo').textContent = 'Editar Vehículo';
  document.getElementById('btnGuardarVeh').textContent = '💾 Actualizar Vehículo';
  document.getElementById('btnCancelar').style.display = 'inline-flex';
  document.getElementById('cardVehiculo').classList.remove('collapsed');
  document.getElementById('cardVehiculo').scrollIntoView({ behavior: 'smooth', block: 'center' });
}

function cancelarEdicion() {
  editandoId = null;
  limpiarFormVeh();
  document.getElementById('tituloVehiculo').textContent = 'Registrar mi Vehículo';
  document.getElementById('btnGuardarVeh').textContent = '💾 Guardar Vehículo';
  document.getElementById('btnCancelar').style.display = 'none';
}

function eliminarVehiculo(id) {
  if (!confirm('¿Eliminar este vehículo y TODOS sus trámites?')) return;
  data.vehiculos = data.vehiculos.filter(v => v.id !== id);
  data.tramites = data.tramites.filter(t => t.vehiculoId !== id);
  guardar();
  refrescarSelect();
  document.getElementById('buscarDominio').value = '';
  render();
  toast('🗑️ Vehículo eliminado');
}

// ============================================================
// TRÁMITES
// ============================================================
function agregarTramite() {
  const vehiculoId = +document.getElementById('vehiculoSel').value;
  const tipo = document.getElementById('tipoDoc').value;
  const fecha = document.getElementById('fechaVenc').value;
  const importe = document.getElementById('importe').value;
  const notas = document.getElementById('notas').value.trim();

  if (!vehiculoId) return toast('⚠️ Selecciona un vehículo');
  if (!fecha) return toast('⚠️ Ingresa la fecha de vencimiento');

  data.tramites.push({ id: Date.now(), vehiculoId, tipo, fecha, importe, notas });
  guardar();
  document.getElementById('fechaVenc').value = '';
  document.getElementById('importe').value = '';
  document.getElementById('notas').value = '';
  render();
  toast('✅ Trámite registrado');
}

function eliminarTramite(id) {
  if (!confirm('¿Eliminar este trámite?')) return;
  data.tramites = data.tramites.filter(t => t.id !== id);
  guardar();
  render();
  toast('🗑️ Trámite eliminado');
}

function refrescarSelect() {
  const sel = document.getElementById('vehiculoSel');
  if (!data.vehiculos.length) {
    sel.innerHTML = '<option value="">-- Primero registra un vehículo --</option>';
    return;
  }
  sel.innerHTML = '<option value="">-- Selecciona vehículo --</option>' +
    data.vehiculos.map(v => `<option value="${v.id}">${v.placa} · ${v.marca} ${v.modelo}</option>`).join('');
}

// ============================================================
// CÁLCULOS
// ============================================================
function diasRestantes(fecha) {
  const hoy = new Date(); hoy.setHours(0,0,0,0);
  const venc = new Date(fecha + 'T00:00:00');
  return Math.ceil((venc - hoy) / 86400000);
}

function estado(d) {
  if (d < 0) return { clase: 'danger', texto: 'Vencido' };
  if (d <= 30) return { clase: 'warn', texto: 'Por vencer' };
  return { clase: 'ok', texto: 'Vigente' };
}

function formatoMoneda(n) {
  if (!n && n !== 0) return '—';
  return '$ ' + Number(n).toLocaleString('es-AR', { minimumFractionDigits: 0, maximumFractionDigits: 0 });
}

function formatoNumero(n) {
  if (n === '' || n === null || n === undefined) return '';
  return Number(n).toLocaleString('es-AR');
}

function setFiltro(f) { filtroTramites = f; render(); }

// ============================================================
// BUSCADOR / FICHA
// ============================================================
function buscarVehiculo() {
  const q = document.getElementById('buscarDominio').value.trim().toUpperCase();
  const cont = document.getElementById('fichaContainer');

  if (!q) { cont.innerHTML = ''; return; }

  const v = data.vehiculos.find(x => x.placa.toUpperCase() === q)
          || data.vehiculos.find(x => x.placa.toUpperCase().includes(q));

  if (!v) {
    cont.innerHTML = `<div class="ficha"><div class="empty">
      <span class="empty-emoji">🔎</span>
      <div class="empty-title">No se encontró "${q}"</div>
      <div class="empty-sub">Verifica el dominio o regístralo abajo en "Registrar mi Vehículo"</div>
    </div></div>`;
    return;
  }

  // Preparar trámites
  const todosTramites = data.tramites
    .filter(t => t.vehiculoId === v.id)
    .map(t => ({ ...t, dias: diasRestantes(t.fecha), est: estado(diasRestantes(t.fecha)) }))
    .sort((a, b) => a.dias - b.dias);

  // Filtrar según chip
  const tramites = todosTramites.filter(t => {
    if (filtroTramites === 'todos') return true;
    if (filtroTramites === 'vigente') return t.dias > 30;
    if (filtroTramites === 'porVencer') return t.dias >= 0 && t.dias <= 30;
    if (filtroTramites === 'vencido') return t.dias < 0;
    return true;
  });

  const totalImportes = todosTramites.reduce((s, t) => s + (Number(t.importe) || 0), 0);

  // Service
  let serviceInfo = null;
  if (v.kmProximoService) {
    const kmFaltan = Number(v.kmProximoService) - Number(v.kmActual || 0);
    const dias = v.fechaProximoService ? diasRestantes(v.fechaProximoService) : null;
    let clase = 'ok';
    if (kmFaltan <= 0 || (dias !== null && dias < 0)) clase = 'danger';
    else if (kmFaltan <= 1000 || (dias !== null && dias <= 30)) clase = 'warn';
    serviceInfo = { kmFaltan, dias, clase };
  }

  // Cuota seguro
  let cuotaInfo = null;
  if (v.fechaVencimientoCuota) {
    const dias = diasRestantes(v.fechaVencimientoCuota);
    const est = estado(dias);
    cuotaInfo = { dias, est };
  }

  // Próximo vencimiento general (para banner countdown)
  const candidatos = [];
  todosTramites.forEach(t => candidatos.push({ tipo: t.tipo, fecha: t.fecha, dias: t.dias, emoji: '📄' }));
  if (v.fechaProximoService) {
    candidatos.push({ tipo: 'Service', fecha: v.fechaProximoService, dias: diasRestantes(v.fechaProximoService), emoji: '🛣️' });
  }
  if (v.fechaVencimientoCuota) {
    candidatos.push({ tipo: 'Cuota de seguro', fecha: v.fechaVencimientoCuota, dias: diasRestantes(v.fechaVencimientoCuota), emoji: '💰' });
  }
  const proximo = candidatos.length ? candidatos.sort((a, b) => a.dias - b.dias)[0] : null;

  // Banner countdown
  let bannerHTML = '';
  if (proximo) {
    const est = estado(proximo.dias);
    const textoDias = proximo.dias < 0 ? 'VENCIDO' :
                      proximo.dias === 0 ? 'HOY' :
                      proximo.dias === 1 ? '1 día' :
                      proximo.dias + ' días';
    bannerHTML = `
      <div class="countdown ${est.clase}">
        <div class="countdown-left">
          <div>
            <div class="countdown-label">${proximo.dias < 0 ? 'Venció hace' : 'Faltan'}</div>
            <div class="countdown-num">${proximo.dias < 0 ? Math.abs(proximo.dias) : proximo.dias}</div>
            <div class="countdown-label">${proximo.dias === 1 || proximo.dias === -1 ? 'día' : 'días'}</div>
          </div>
          <div>
            <div class="countdown-label">Próximo vencimiento</div>
            <div class="countdown-tipo">${proximo.emoji} ${proximo.tipo}</div>
            <div class="countdown-fecha">${proximo.fecha} · ${textoDias}</div>
          </div>
        </div>
        ${totalImportes ? `
        <div class="countdown-right">
          <div class="countdown-total-label">Total en trámites</div>
          <div class="countdown-total">${formatoMoneda(totalImportes)}</div>
        </div>` : ''}
      </div>
    `;
  }

  // HTML Service
  let serviceHTML = '';
  if (v.kmActual || v.kmProximoService || v.fechaProximoService) {
    serviceHTML = `
      <div class="ficha-section-title">🛣️ Mantenimiento</div>
      <div class="ficha-grid">
        ${dato('Kilometraje actual', v.kmActual ? formatoNumero(v.kmActual) + ' km' : '')}
        ${dato('Próximo service (km)', v.kmProximoService ? formatoNumero(v.kmProximoService) + ' km' : '')}
        ${dato('Próximo service (fecha)', v.fechaProximoService)}
        ${serviceInfo ? `
          <div class="dato alert-${serviceInfo.clase}">
            <div class="dato-label">Estado del service</div>
            <div class="dato-value">
              ${serviceInfo.kmFaltan <= 0
                ? '⚠️ Service vencido por km'
                : `Faltan ${formatoNumero(serviceInfo.kmFaltan)} km`}
              ${serviceInfo.dias !== null ? ` · ${serviceInfo.dias} días` : ''}
            </div>
          </div>` : ''}
      </div>
    `;
  }

  // HTML Seguro
  let seguroHTML = '';
  if (v.seguro || v.seguroMensual || v.fechaVencimientoCuota) {
    seguroHTML = `
      <div class="ficha-section-title">💰 Seguro</div>
      <div class="ficha-grid">
        ${dato('Compañía', v.seguro)}
        ${dato('Cuota mensual', v.seguroMensual ? formatoMoneda(v.seguroMensual) : '')}
        ${dato('Próximo vencimiento cuota', v.fechaVencimientoCuota)}
        ${cuotaInfo ? `
          <div class="dato alert-${cuotaInfo.est.clase}">
            <div class="dato-label">Estado de la cuota</div>
            <div class="dato-value">
              ${cuotaInfo.dias < 0
                ? `⚠️ Vencida hace ${Math.abs(cuotaInfo.dias)} días`
                : cuotaInfo.dias === 0
                  ? '⚠️ Vence HOY'
                  : `Faltan ${cuotaInfo.dias} días`}
            </div>
          </div>` : ''}
      </div>
    `;
  }

  const logoURL = getLogoURL(v.marca);

  cont.innerHTML = `
    <div class="ficha">
      <div class="ficha-header">
        <div class="ficha-header-content">
          ${logoURL ? `<img class="marca-logo-grande" src="${logoURL}" alt="${v.marca}" onerror="this.style.display='none'">` : ''}
          ${v.foto ? `<img class="ficha-foto" src="${v.foto}" alt="${v.marca} ${v.modelo}" onerror="this.style.display='none'">` : ''}
          <div>
            <div class="ficha-placa">${v.placa}</div>
            <div class="ficha-sub">${v.marca} ${v.modelo} ${v.anio ? '· ' + v.anio : ''} ${v.color ? '· ' + v.color : ''}</div>
          </div>
        </div>
        <div class="ficha-actions">
          <button class="btn-white" onclick="editarVehiculo(${v.id})">✏️ Editar</button>
          <button class="btn-white btn-print" onclick="window.print()">🖨️ Imprimir</button>
          <button class="btn-white" onclick="eliminarVehiculo(${v.id})">🗑️</button>
        </div>
      </div>

      ${bannerHTML}

      <div class="ficha-body">

        <div class="ficha-section-title">📋 Datos del vehículo</div>
        <div class="ficha-grid">
          <div class="dato">
            <div class="dato-label">Marca</div>
            <div class="dato-value" style="display:flex;align-items:center;gap:10px">
              ${logoURL ? `<img class="marca-logo" src="${logoURL}" alt="${v.marca}" onerror="this.style.display='none'">` : ''}
              <span>${v.marca || '—'}</span>
            </div>
          </div>
          ${dato('Modelo', v.modelo)}
          ${dato('Año', v.anio)}
          ${dato('Color', v.color)}
          ${dato('⛽ Combustible', v.combustible)}
          ${dato('⚙️ Caja', v.caja)}
          ${dato('N° Chasis', v.chasis)}
          ${dato('N° Motor', v.motor)}
          ${dato('Radicación', v.radicacion)}
          ${dato('Valuación fiscal', v.valuacion ? formatoMoneda(v.valuacion) : '')}
        </div>

        ${serviceHTML}
        ${seguroHTML}

        <div class="ficha-section-title">👤 Propietario</div>
        <div class="ficha-grid">
          ${dato('Nombre', v.propietario)}
          ${dato('DNI / CUIT', v.dni)}
        </div>

        ${v.notasVeh ? `
        <div class="ficha-section-title">📝 Notas</div>
        <div class="notas-box">${v.notasVeh}</div>` : ''}

        <div class="ficha-section-title" style="margin-top:24px">
          📅 Trámites y vencimientos (${todosTramites.length})
        </div>

        <div class="filtros">
          <button class="chip ${filtroTramites === 'todos' ? 'active' : ''}" onclick="setFiltro('todos')">Todos (${todosTramites.length})</button>
          <button class="chip ${filtroTramites === 'vigente' ? 'active' : ''}" onclick="setFiltro('vigente')">Vigentes (${todosTramites.filter(t => t.dias > 30).length})</button>
          <button class="chip ${filtroTramites === 'porVencer' ? 'active' : ''}" onclick="setFiltro('porVencer')">Por vencer (${todosTramites.filter(t => t.dias >= 0 && t.dias <= 30).length})</button>
          <button class="chip ${filtroTramites === 'vencido' ? 'active' : ''}" onclick="setFiltro('vencido')">Vencidos (${todosTramites.filter(t => t.dias < 0).length})</button>
        </div>

        ${tramites.length ? tramites.map(t => `
          <div class="tramite-row ${t.est.clase}">
            <div class="tramite-info">
              <div class="tramite-tipo">${t.tipo}</div>
              <div class="tramite-fecha">Vence: ${t.fecha} ${t.notas ? '· ' + t.notas : ''}</div>
            </div>
            <div style="text-align:right">
              <div class="tramite-importe">${formatoMoneda(t.importe)}</div>
              <div style="font-size:11px;color:var(--text-muted);margin-top:2px">${t.dias} días</div>
            </div>
            <span class="badge ${t.est.clase}">${t.est.texto}</span>
            <button class="btn-icon" onclick="eliminarTramite(${t.id})" title="Eliminar">✕</button>
          </div>
        `).join('') : `
          <div style="text-align:center;padding:20px;color:var(--text-muted);font-size:14px">
            ${todosTramites.length ? 'Sin trámites en este filtro.' : 'Sin trámites registrados. Agrégalos abajo 👇'}
          </div>
        `}

        ${todosTramites.length ? `
          <div class="total-box">
            <div>
              <div class="total-label">Total en trámites</div>
              <div class="total-value">${formatoMoneda(totalImportes)}</div>
            </div>
            ${proximo ? `
            <div style="text-align:right">
              <div class="total-label">Próximo vencimiento</div>
              <div style="font-size:15px;font-weight:700;color:#fff">${proximo.emoji} ${proximo.tipo} · ${proximo.fecha}</div>
            </div>` : ''}
          </div>
        ` : ''}

      </div>
    </div>
  `;
}

function dato(label, valor) {
  const vacio = !valor;
  return `<div class="dato">
    <div class="dato-label">${label}</div>
    <div class="dato-value ${vacio ? 'vacio' : ''}">${vacio ? '—' : valor}</div>
  </div>`;
}

function render() { buscarVehiculo(); }

// ============================================================
// EXPORTAR / IMPORTAR
// ============================================================
function exportar() {
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'backup-mi-vehiculo-' + new Date().toISOString().slice(0,10) + '.json';
  a.click();
  toast('💾 Backup descargado');
}

function importar(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    try {
      const nuevo = JSON.parse(ev.target.result);
      if (!nuevo.vehiculos || !nuevo.tramites) throw new Error('bad');
      data = nuevo;
      guardar();
      refrescarSelect();
      render();
      toast('✅ Datos importados');
    } catch {
      toast('⚠️ Archivo inválido');
    }
  };
  reader.readAsText(file);
  e.target.value = '';
}

document.getElementById('buscarDominio').addEventListener('input', buscarVehiculo);

refrescarSelect();
render();
</script>
</body>
</html>
